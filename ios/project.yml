name: PlaudTemplateApp
options:
  bundleIdPrefix: com.plaud
  projectFormat: Xcode 14.0
  postGenCommand: perl -0pi -e 's/objectVersion = \d+;/objectVersion = 56;/; s/\n\t\t\tpreferredProjectObjectVersion = \d+;//; s/\n\t\t\tminimizedProjectReferenceProxies = 1;//; s/\n\t\t\tcompatibilityVersion = "Xcode 14.0";//g; s|(\/\* Begin PBXProject section \*\/.*?buildConfigurationList = .*?;\n)|$1\t\t\tcompatibilityVersion = "Xcode 14.0";\n|s' PlaudTemplateApp.xcodeproj/project.pbxproj
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true

configFiles:
  Debug: PartnerConfig.xcconfig
  Release: PartnerConfig.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: W8JQQJQR29

targets:
  PlaudTemplateApp:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    settings:
      base:
        # Unique bundle id registerable under the signing team (the bare
        # com.plaud.PlaudTemplateApp is already taken by another team).
        PRODUCT_BUNDLE_IDENTIFIER: com.plaud.PlaudTemplateApp1
    entitlements:
      path: PlaudTemplateApp/PlaudTemplateApp.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
        com.apple.developer.networking.wifi-info: true
    sources:
      - path: PlaudTemplateApp
    resources:
      - path: ../sdk/ios/PlaudDeviceBasicSDK.bundle
    dependencies:
      - framework: ../sdk/ios/PlaudDeviceBasicSDK.framework
        embed: true
      - framework: ../sdk/ios/PlaudBleSDK.framework
        embed: true
      - framework: ../sdk/ios/PlaudWiFiSDK.framework
        embed: true
    info:
      path: PlaudTemplateApp/Info.plist
      properties:
        CFBundleShortVersionString: "1.1.8"
        CFBundleVersion: "70"
        UILaunchScreen:
          UIColorName: "systemBackground"
        UserAccessToken: $(USER_ACCESS_TOKEN)
        PartnerToken: $(PARTNER_TOKEN)
        PlaudClientId: $(PLAUD_CLIENT_ID)
        PlaudApiKey: $(PLAUD_API_KEY)
        NSBluetoothAlwaysUsageDescription: Bluetooth is required to connect to your Plaud recording device.
        NSBluetoothPeripheralUsageDescription: Bluetooth is required to connect to your Plaud recording device.
        NSLocalNetworkUsageDescription: Local network access is required for WiFi fast transfer.
        NSLocationWhenInUseUsageDescription: Location access is required for WiFi fast transfer and to discover your Plaud device nearby.
        # iBeacon background wake-up (SDK v1.0.15) — both keys are mandatory:
        # the SDK asserts at runtime if the location background mode is missing.
        NSLocationAlwaysAndWhenInUseUsageDescription: Allows the app to detect your Plaud device in the background and reconnect automatically to sync recordings.
        UIBackgroundModes:
          - bluetooth-central
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
